name: XTDB CI
run-name: XTDB CI

on:
  push:
    branches-ignore:
      - docs-live

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !(github.repository == 'xtdb/xtdb' && github.ref_name == 'main') }}

jobs:
  native-ffi:
    name: Build RTDB native library
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - name: Build RTDB FFI
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
        run: |
          rust_version=$(awk -F '"' '$1 == "rust-version = " { print $2; exit }' rust/Cargo.toml)
          test -n "$rust_version"
          rustup toolchain install "$rust_version" --profile minimal
          cargo "+$rust_version" build --locked --manifest-path rust/Cargo.toml --package rtdb-ffi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rtdb-native-ffi
          path: rust/target/debug/librtdb_ffi.so
          if-no-files-found: error
          retention-days: 1

  gradle-test:
    name: Gradle Test
    needs: native-ffi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Pick and set a random system-wide time zone
        run: |
          TZ_LIST=$(timedatectl list-timezones)
          RANDOM_TZ=$(echo "$TZ_LIST" | shuf -n 1)
          echo "Randomly selected time zone: $RANDOM_TZ"

          # Set system time zone
          sudo ln -snf /usr/share/zoneinfo/$RANDOM_TZ /etc/localtime
          echo "$RANDOM_TZ" | sudo tee /etc/timezone
          sudo dpkg-reconfigure -f noninteractive tzdata

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: |
            25
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: rtdb-native-ffi
          path: ${{ runner.temp }}/rtdb-native-ffi

      - name: Test
        run: ./gradlew "-Dxtdb.native.library=$RUNNER_TEMP/rtdb-native-ffi/librtdb_ffi.so" test :xtdb-core:jmhClasses
        timeout-minutes: 15

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        if: success() || failure() # always run even if the previous step fails
        with:
          check_name: JUnit Test Report
          report_paths: '**/build/test-results/test/TEST-*.xml'
      - name: Post Slack Notification (On Fail)
        if: failure() && github.repository == 'xtdb/xtdb' && github.ref == 'refs/heads/main'
        uses: ravsamhq/notify-slack-action@be814b201e233b2dc673608aa46e5447c8ab13f2 # v2.5.0
        with:
          status: ${{ job.status }}
          notification_title: "*{workflow}* has {status_message}:"
          message_format: "{emoji} `gradle-test` job has {status_message} in *{workflow}*"
          notify_when: "failure"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  codegen-report:
    name: Codegen Report
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: |
            25
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # this job reports, it never gates - so a JVM that dies on its way to the report
      # (OOM, timeout, a namespace that won't load) must not turn a push red either
      - name: Report
        run: ./gradlew -q codegen-report
        timeout-minutes: 15
        continue-on-error: true

      - name: Publish to job summary
        if: success() || failure()
        run: |
          {
            echo '### Reflection and boxed math in EE-generated code'
            echo ''
            echo '```'
            cat build/codegen-report.txt || echo 'no report produced - see the Report step'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  lang-test:
    name: Non-JVM language tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: |
            25
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build XTDB shadowJar
        run: ./gradlew :docker:standalone:shadowJar

      - name: XTDB service
        uses: hoverkraft-tech/compose-action@b659c744ee9bed25aea2307c017ad849bd104433 # v3.2.0
        with:
          services: "xtdb"
          cwd: "lang"
          up-flags: "--wait"

      - name: Dump XTDB logs on startup failure
        if: failure()
        working-directory: "lang"
        run: docker compose logs xtdb

      - name: JS test
        working-directory: "lang"
        run: |
          docker compose run js

      - name: Python test
        working-directory: "lang"
        run: |
          docker compose run python

      - name: Elixir test
        working-directory: "lang"
        run: |
          docker compose run elixir

      - name: Rust test
        working-directory: "lang"
        run: |
          docker compose run rust

      - name: .NET test
        working-directory: "lang"
        run: |
          docker compose run dotnet

      - name: Dump all logs on test failure
        if: failure()
        working-directory: "lang"
        run: docker compose logs

      - name: Post Slack Notification (On Fail)
        if: failure() && github.repository == 'xtdb/xtdb' && github.ref == 'refs/heads/main'
        uses: ravsamhq/notify-slack-action@be814b201e233b2dc673608aa46e5447c8ab13f2 # v2.5.0
        with:
          status: ${{ job.status }}
          notification_title: "*{workflow}* has {status_message}:"
          message_format: "{emoji} `lang-test` job has {status_message} in *{workflow}*"
          notify_when: "failure"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  integration-test:
    name: Integration Test
    needs: native-ffi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: |
            25
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: rtdb-native-ffi
          path: ${{ runner.temp }}/rtdb-native-ffi

      - name: Integration Test
        run: ./gradlew "-Dxtdb.native.library=$RUNNER_TEMP/rtdb-native-ffi/librtdb_ffi.so" integration-test
        timeout-minutes: 15
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        if: success() || failure() # always run even if the previous step fails
        with:
          check_name: JUnit Integration Test Report
          report_paths: '**/build/test-results/integration-test/TEST-*.xml'
      - name: Post Slack Notification (On Fail)
        if: failure() && github.repository == 'xtdb/xtdb' && github.ref == 'refs/heads/main'
        uses: ravsamhq/notify-slack-action@be814b201e233b2dc673608aa46e5447c8ab13f2 # v2.5.0
        with:
          status: ${{ job.status }}
          notification_title: "*{workflow}* has {status_message}:"
          message_format: "{emoji} `integration-test` job has {status_message} in *{workflow}*"
          notify_when: "failure"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  slt-1:
    name: SLT 1
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: |
            25
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: SLT 1
        run: ./gradlew slt-test
        timeout-minutes: 20

  slt-2:
    name: SLT 2
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: |
            25
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: SLT 2
        run: ./gradlew slt-test-2
        timeout-minutes: 40

  property-test:
    uses: ./.github/workflows/property-test.yml
    secrets: inherit
    with:
      iteration_count: "100"
      simulation_iteration_count: "100"
    permissions:
      contents: read
      checks: write
