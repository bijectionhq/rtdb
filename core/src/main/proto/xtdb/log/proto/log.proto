edition = "2023";

package xtdb.log.proto;

import "xtdb/database/proto/db.proto";

option java_multiple_files = true;

// Behavioural spec: dev/doc/db.allium

message SourceLogMessage {
    // 5 was block_uploaded, only ever written by unreleased builds between 2.1 and 2.2.
    reserved 5;

    oneof message {
        FlushBlock flush_block = 1;
        TriesAdded tries_added = 2;
        AttachDatabase attach_database = 3;
        DetachDatabase detach_database = 4;
        Tx tx = 6;
        ArtefactsAdded artefacts_added = 7;
        ArtefactsRemoved artefacts_removed = 8;
    }
}

message Tx {
    bytes tx_ops = 1;
    reserved 2;
    reserved system_time_micros;
    string default_tz = 3;
    string user = 4;
    bytes user_metadata = 5;
    bytes external_source_token = 6;
    IdempotencyGuard idempotency_guard = 7;
    ReplaySubmission replay_submission = 8;
    // The intake position comes from the log record's metadata.
    bytes placed_attempt_seed = 9;
    BoundedRetry bounded_retry = 10;
    reserved 11;
    reserved prepared_landing;
}

message BoundedRetry {
    bytes nonce = 1;
    int64 not_after_micros = 2;
}

message IdempotencyGuard {
    int64 submitted_at_micros = 1;
    bool after_bootstrap = 2;
}

message ReplaySubmission {
    string key = 1;
    int64 submitted_at_micros = 2;
    int64 not_after_micros = 3;
    bool abort_on_legacy_resolver = 4;
}

message BlockUploaded {
    int32 storage_version = 1;
    int32 storage_epoch = 2;
    int64 block_index = 3;
    int64 latest_processed_msg_id = 4;
    repeated TrieDetails tries = 5;
    bytes external_source_token = 6;
    // SHA-256 of the exact encoded block catalog selected by this upload.
    bytes catalog_sha256 = 7;
}

message FlushBlock {
    int64 expected_block_idx = 2;
}

message TriesAdded {
    int32 storage_version = 2;
    int32 storage_epoch = 3;
    repeated TrieDetails tries = 1;
    int64 source_msg_id = 4;
}

message TemporalMetadata {
    int64 min_valid_from = 1 [default = 9223372036854775807];
    int64 max_valid_from = 2 [default = -9223372036854775808];
    int64 min_valid_to = 3 [default = 9223372036854775807];
    int64 max_valid_to = 4 [default = -9223372036854775808];
    int64 min_system_from = 5 [default = 9223372036854775807];
    int64 max_system_from = 6 [default = -9223372036854775808];
}

message TrieMetadata {
    TemporalMetadata temporal_metadata = 1;
    int64 row_count = 2 [default = 0];
    // deprecated, see #5355: never consulted at query time;
    // retained for backwards compatibility with existing block files.
    bytes iid_bloom = 8;
}

enum TrieState {
    NASCENT = 0;
    LIVE = 1;
    GARBAGE = 2;
}

message TrieDetails {
    string table_name = 1;
    string trie_key = 2;
    int64 data_file_size = 3;
    TrieMetadata trie_metadata = 4;
    TrieState trie_state = 5;
    int64 garbage_as_of = 6;
    repeated ArtefactRecord artefacts = 7;
    TrieFileVersions published_files = 8;
}

// Physical identities returned when the immutable files were published.
message TrieFileVersions {
    PublishedObjectVersion data = 1;
    PublishedObjectVersion metadata = 2;
}

message PublishedObjectVersion {
    string bucket = 1;
    string endpoint = 2;
    string region = 3;
    string key = 4;
    string version = 5;
    TerminalPublication terminal = 6;
}

message TerminalPublication {
    bytes allocation = 1;
    string etag = 2;
}

// A file derived from a trie's data file (e.g. a search index), recorded on the trie's catalog entry and deleted with it.
// Behavioural spec: dev/doc/fts.allium
message ArtefactRecord {
    string kind = 1;
    string definition_id = 2;
    int64 definition_version = 3;
    // Opaque to the core: the artefact kind owns its encoding.
    bytes stats = 4;
    ArtefactScope scope = 5;
    // Size of the published object, including its headers and auxiliary sections.
    int64 file_size = 6;
    PublishedObjectVersion published_version = 7;
    repeated string pack_members = 8;
}

// The data files one artefact is derived from.
// Behavioural spec: dev/doc/trie-cat.allium
enum ArtefactScope {
    // Its trie's own data file.
    TRIE = 0;
    // Every data file of its trie's partition group, recorded alike on each member's entry, and deleted once no member remains.
    PART_GROUP = 1;
    PACK = 2;
}

message ArtefactEntry {
    string trie_key = 1;
    ArtefactRecord record = 2;
}

message EntityDirectoryRoot {
    bytes root = 1;
    int64 through_block = 2;
    int64 source_rows = 3;
    bool has_erases = 4;
    bytes allocation = 5;
    uint64 writer_fence = 6;
    bytes erase_frontier_digest = 7;
}

message EntityDirectoryChange {
    EntityDirectoryRoot root = 1;
    bytes replaces_root = 2;
}

message SearchRun {
    string definition_id = 1;
    int64 definition_version = 2;
    repeated int64 blocks = 3;
    bytes digest = 4;
    bytes locator = 5;
    int64 file_size = 6;
    PublishedObjectVersion publication = 7;
    int64 rebuild = 8;
    int64 source_rows = 9;
    bool has_erases = 10;
  bytes allocation = 11;
  reserved 12;
  SourceReceipt source_receipt = 13;
}

message SourceReceipt {
    string lineage = 1;
    int64 checkpoint_boundary = 2;
    int64 suffix_through = 3;
    string table = 4;
    bytes shard_range = 5;
    int64 source_rows = 6;
    bytes erase_frontier_digest = 7;
    bytes directory_root = 8;
    repeated int64 blocks = 9;
    bytes checkpoint_catalog_sha256 = 10;
}

message SearchRunChange {
    SearchRun run = 1;
    repeated bytes replaces = 2;
    bool retire_only = 3;
  bool abandon = 4;
    reserved 5 to 9;
    TermDirectoryRoot term_directory = 10;
    bytes replaces_directory = 11;
    int64 prune_settled_at = 12;
}

message TermDirectoryRoot {
    string definition_id = 1;
    int64 definition_version = 2;
    bytes root = 3;
    int64 runs = 4;
    // Digest of the exact run identities the pages cover. A reader whose
    // active runs differ, as after an erase replaced a run, treats the
    // directory as building and ranks without its bounds.
    bytes run_set = 5;
}

message RetiredSearchRun {
    SearchRun run = 1;
    int64 superseded_at = 2;
  bool abandoned = 3;
  bool released = 4;
    int64 settled_at_replica_msg_id = 5;
}

message ArtefactsAdded {
    int32 storage_version = 1;
    int32 storage_epoch = 2;
    string table_name = 3;
    repeated ArtefactEntry entries = 4;
    int64 source_msg_id = 5;
}

// Artefact records to remove from their tries' entries; the artefact lane deletes their files once this is applied.
message ArtefactsRemoved {
    int32 storage_version = 1;
    int32 storage_epoch = 2;
    string table_name = 3;
    repeated ArtefactEntry entries = 4;
    int64 source_msg_id = 5;
}

message AttachDatabase {
    string db_name = 1;
    xtdb.database.proto.DatabaseConfig config = 2;
}

message DetachDatabase {
    string db_name = 1;
}

