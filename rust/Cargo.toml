[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["vendor/bijection-geometry", "vendor/bijection-store-derive", "vendor/bijection-store-filter", "vendor/bijection-store-judge", "vendor/apache-avro", "vendor/fancy-regex", "vendor/validation-json", "vendor/validation-referencing", "vendor/validation-jsonschema", "vendor/rdkafka", "vendor/rdkafka-sys", "vendor/rustls", "vendor/openssl-src", "vendor/sqlparser", "vendor/bijection/store_read", "vendor/bijection/kernel_text", "vendor/bijection/geometry"]

[patch.crates-io]
rustls = { path = "vendor/rustls" }
openssl-src = { path = "vendor/openssl-src" }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
license = "MPL-2.0"
publish = false
repository = "https://github.com/bijectionhq/rtdb"

[workspace.dependencies]
stacker = "0.1.25"
rtdb-types = { path = "crates/types" }
rtdb-java-date = { path = "crates/java-date" }
rtdb-columnar = { path = "crates/columnar" }
rtdb-temporal = { path = "crates/temporal" }
rtdb-trie = { path = "crates/trie" }
rtdb-format = { path = "crates/format" }
rtdb-storage = { path = "crates/storage" }
rtdb-crypt = { path = "crates/crypt" }
rtdb-index = { path = "crates/index" }
rtdb-plan = { path = "crates/plan" }
rtdb-expr = { path = "crates/expr" }
rtdb-query = { path = "crates/query" }
rtdb-xtql = { path = "crates/xtql" }
rtdb-sql = { path = "crates/sql" }
rtdb-replication = { path = "crates/replication" }
rtdb-tx = { path = "crates/tx" }
rtdb-maintenance = { path = "crates/maintenance" }
rtdb-db = { path = "crates/db" }
rtdb-node = { path = "crates/node" }
rtdb-kafka = { path = "crates/kafka" }
rtdb-s3 = { path = "crates/s3" }
rtdb-azure = { path = "crates/azure" }
rtdb-gcs = { path = "crates/gcs" }
rtdb-pg-source = { path = "crates/pg-source" }
rtdb-auth = { path = "crates/auth" }
rtdb-pg-codec = { path = "crates/pg-codec" }
rtdb-pgwire = { path = "crates/pgwire" }
rtdb-server = { path = "crates/server", default-features = false }
rtdb-metrics = { path = "crates/metrics" }
rtdb-flight-sql = { path = "crates/flight-sql" }
rtdb-ffi = { path = "crates/ffi" }
rtdb-tls = { path = "crates/tls" }
rtdb-affinity = { path = "crates/affinity" }
rtdb-directory = { path = "crates/directory" }
rtdb-logkeeper = { path = "crates/logkeeper" }
journal-contract = { git = "https://github.com/bijectionhq/logkeeper.git", rev = "34fb69ed201849c464701861c31acbc8903ebc5d" }
stream-logkeeper = { package = "logkeeper", git = "https://github.com/bijectionhq/logkeeper.git", rev = "34fb69ed201849c464701861c31acbc8903ebc5d", features = ["stream"] }
ordered-logkeeper = { package = "logkeeper", git = "https://github.com/bijectionhq/logkeeper.git", rev = "34fb69ed201849c464701861c31acbc8903ebc5d", features = ["ordered-daemon"] }
rtdb-multi = { path = "crates/multi" }
rtdb-simulation = { path = "crates/simulation" }
rtdb-text = { path = "crates/text" }
rtdb-search = { path = "crates/search" }
rtdb-spatial = { path = "crates/spatial" }
rtdb-vector = { path = "crates/vector" }
sqlparser = { path = "vendor/sqlparser", version = "=0.63.0" }
arrow-array = { version = "=58.4.1", features = ["ffi"] }
arrow-buffer = "=58.4.1"
arrow-data = { version = "=58.4.1", features = ["ffi"] }
arrow-schema = { version = "=58.4.1", features = ["ffi", "serde"] }
arrow-select = "=58.4.1"
arrow-ipc = { version = "=58.4.1", features = ["lz4", "zstd"] }
async-trait = "0.1"
memmap2 = "=0.9.12"
tantivy = { version = "=0.27.0", default-features = false, features = ["mmap"] }
stable_deref_trait = "1.2"
async-stream = "=0.3.6"
http = "1"
base64 = "0.22"
bincode = "1.3.3"
bytes = { version = "1", features = ["serde"] }
crc32fast = "1.5"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10.4"
tracing = "=0.1.44"
bigdecimal = "0.4.10"
num-bigint = "0.4.8"
num-rational = "0.4.2"
num-traits = "0.2.19"
regex = "1"
regex-syntax = "=0.8.11"
unicode-normalization = { version = "=0.1.26", default-features = false }
unicode-segmentation = "=1.12.0"
rust-stemmers = "=1.2.0"
fancy-regex = { version = "=0.16.2", path = "vendor/fancy-regex" }
futures = "0.3"
fs2 = "0.4"
half = "2"
lz4_flex = { version = "=0.13.1", default-features = false, features = ["std", "frame"] }
zstd = "0.13"
parking_lot = "0.12"
object_store = { version = "=0.13.2", default-features = false }
prost = "0.14.3"
prost-types = "0.14.3"
prost-build = "0.14.3"
protoc-bin-vendored = "3"
roaring = "0.11.5"
serde = { version = "1", features = ["derive", "rc"] }
imbl = { version = "=7.0.2", features = ["serde"] }
indexmap = { version = "2.14", features = ["serde"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order", "raw_value"] }
ciborium = "0.2.2"
serde_yaml = "=0.9.34"
sha2 = "0.10"
subtle = "2.6.1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
aws-types = "=1.7.0"
aws-sdk-dynamodb = "=1.132.0"
aws-sdk-dynamodbstreams = "=1.126.0"
aws-sdk-s3 = { version = "=1.155.0", default-features = false, features = ["default-https-client", "http-1x", "rt-tokio", "rustls"] }
uuid = { version = "1", features = ["serde", "v4"] }
url = "2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
