import org.gradle.api.tasks.JavaExec
import org.gradle.api.tasks.SourceSetContainer
import org.gradle.api.tasks.testing.Test
import org.gradle.process.CommandLineArgumentProvider

gradle.projectsEvaluated {
    def root = gradle.rootProject
    def fixture = root.providers.gradleProperty("rtdb.fixture")
    def output = root.providers.gradleProperty("rtdb.output")
    def referenceTest = root.tasks.named("test", Test)
    def configureRuntime = { JavaExec task ->
        def test = referenceTest.get()
        task.javaLauncher.set(test.javaLauncher)
        task.jvmArgs(test.jvmArgs)
        task.systemProperties(test.systemProperties)
        task.minHeapSize = test.minHeapSize
        task.maxHeapSize = test.maxHeapSize
        task.defaultCharacterEncoding = test.defaultCharacterEncoding
        task.enableAssertions = test.enableAssertions
        task.systemProperty("user.timezone", "UTC")
    }
    root.tasks.register("rtdbConformanceObserve", JavaExec) { task ->
        configureRuntime(task)
        dependsOn root.tasks.named("testClasses")
        classpath = root.extensions.getByType(SourceSetContainer).getByName("test").runtimeClasspath +
            root.files(root.providers.gradleProperty("rtdb.adapterRoot").get())
        mainClass = "clojure.main"
        argumentProviders.add({ ["-m", "rtdb.conformance.controls", fixture.get(), output.get()] } as CommandLineArgumentProvider)
        outputs.upToDateWhen { false }
    }
    root.tasks.register("rtdbConformanceHistory", JavaExec) { task ->
        configureRuntime(task)
        dependsOn root.tasks.named("testClasses")
        classpath = root.extensions.getByType(SourceSetContainer).getByName("test").runtimeClasspath +
            root.files(root.providers.gradleProperty("rtdb.adapterRoot").get())
        mainClass = "clojure.main"
        argumentProviders.add({ ["-m", "rtdb.conformance.history", fixture.get(), output.get()] } as CommandLineArgumentProvider)
        outputs.upToDateWhen { false }
    }
    def configureMixedIidRuntime = { JavaExec task ->
        configureRuntime(task)
        def test = referenceTest.get()
        task.dependsOn root.tasks.named("testClasses")
        task.classpath = test.classpath + root.files(root.providers.gradleProperty("rtdb.adapterRoot").get())
        task.jvmArgumentProviders.addAll(test.jvmArgumentProviders)
        task.environment(test.environment)
        task.environment("XTDB_COMPACTOR_221_OPT_IN", "false")
        def workspace = root.providers.gradleProperty("rtdb.mixedIidWorkspace")
        task.doFirst { task.workingDir(root.file(workspace.get())) }
        task.mainClass.set("clojure.main")
        task.outputs.upToDateWhen { false }
    }
    root.tasks.register("rtdbConformanceMixedIidReference", JavaExec) { task ->
        configureMixedIidRuntime(task)
        argumentProviders.add({ ["-m", "rtdb.conformance.mixed-iid-reference", output.get()] } as CommandLineArgumentProvider)
    }
    root.tasks.register("rtdbConformanceMixedIidReplay", JavaExec) { task ->
        configureMixedIidRuntime(task)
        def request = root.providers.gradleProperty("rtdb.mixedIidRequest")
        argumentProviders.add({ ["-m", "rtdb.conformance.mixed-iid-replay", request.get(), output.get()] } as CommandLineArgumentProvider)
    }
    root.tasks.register("rtdbConformanceParserWire", JavaExec) { task ->
        configureRuntime(task)
        def test = referenceTest.get()
        dependsOn root.tasks.named("testClasses")
        classpath = test.classpath + root.files(root.providers.gradleProperty("rtdb.adapterRoot").get())
        jvmArgumentProviders.addAll(test.jvmArgumentProviders)
        environment(test.environment)
        workingDir(root.file(output.get()))
        mainClass = "clojure.main"
        argumentProviders.add({ ["-m", "rtdb.conformance.parser-wire", fixture.get(), output.get()] } as CommandLineArgumentProvider)
        outputs.upToDateWhen { false }
    }
    root.tasks.register("rtdbConformanceColumnTableAdapterTest", JavaExec) { task ->
        configureRuntime(task)
        dependsOn root.tasks.named("testClasses")
        classpath = root.extensions.getByType(SourceSetContainer).getByName("test").runtimeClasspath +
            root.files(root.providers.gradleProperty("rtdb.adapterRoot").get())
        mainClass = "clojure.main"
        argumentProviders.add({ ["-m", "rtdb.conformance.table-column-test", fixture.get()] } as CommandLineArgumentProvider)
        outputs.upToDateWhen { false }
    }
    root.tasks.register("rtdbConformanceAntiJoinContract", JavaExec) { task ->
        configureRuntime(task)
        def test = referenceTest.get()
        dependsOn root.tasks.named("testClasses")
        classpath = test.classpath + root.files(root.providers.gradleProperty("rtdb.adapterRoot").get())
        jvmArgumentProviders.addAll(test.jvmArgumentProviders)
        environment(test.environment)
        mainClass = "clojure.main"
        argumentProviders.add({ ["-m", "rtdb.conformance.anti-join-contract-test", fixture.get()] } as CommandLineArgumentProvider)
        outputs.upToDateWhen { false }
    }
    root.tasks.register("rtdbConformanceHistoryAdapterTest", JavaExec) { task ->
        configureRuntime(task)
        dependsOn root.tasks.named("testClasses")
        classpath = root.extensions.getByType(SourceSetContainer).getByName("test").runtimeClasspath +
            root.files(root.providers.gradleProperty("rtdb.adapterRoot").get())
        mainClass = "clojure.main"
        args "-m", "rtdb.conformance.history-test"
        outputs.upToDateWhen { false }
    }
    root.tasks.register("rtdbConformanceSqlLogic", JavaExec) { task ->
        configureRuntime(task)
        systemProperty "user.language", "en"
        systemProperty "user.country", "US"
        dependsOn root.tasks.named("testClasses")
        classpath = root.extensions.getByType(SourceSetContainer).getByName("test").runtimeClasspath +
            root.files(root.providers.gradleProperty("rtdb.adapterRoot").get())
        mainClass = "clojure.main"
        argumentProviders.add({ ["-m", "rtdb.conformance.sql-logic", fixture.get(), output.get()] } as CommandLineArgumentProvider)
        outputs.upToDateWhen { false }
    }
    root.tasks.register("rtdbConformanceSqlLogicAdapterTest", JavaExec) { task ->
        configureRuntime(task)
        systemProperty "user.language", "en"
        systemProperty "user.country", "US"
        dependsOn root.tasks.named("testClasses")
        classpath = root.extensions.getByType(SourceSetContainer).getByName("test").runtimeClasspath +
            root.files(root.providers.gradleProperty("rtdb.adapterRoot").get())
        mainClass = "clojure.main"
        args "-m", "rtdb.conformance.sql-logic-test"
        outputs.upToDateWhen { false }
    }
}
