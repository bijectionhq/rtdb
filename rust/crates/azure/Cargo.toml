[package]
name = "rtdb-azure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rtdb-storage = { workspace = true, features = ["remote-cache-http"] }
rtdb-types.workspace = true
rtdb-format.workspace = true
object_store = { workspace = true, features = ["azure"] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio.workspace = true
url.workspace = true
async-trait.workspace = true
azure_core = "=1.0.0"
azure_identity = { version = "=1.0.0", features = ["tokio", "client_certificate"] }
command-group = "=5.0.1"
openssl = "0.10.79"
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "stream"] }
futures.workspace = true
base64.workspace = true
quick-xml = "=0.39.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
