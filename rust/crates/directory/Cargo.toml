[package]
name = "rtdb-directory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The RTDB multi cell directory: deployment placement, writer epochs, member liveness"

[features]
# Serves any directory over TCP, and the client that reaches it.
network = ["dep:tokio-util"]
# The production backend.
dynamodb = ["dep:aws-sdk-dynamodb", "dep:aws-sdk-dynamodbstreams", "dep:aws-types"]

[dependencies]
rtdb-types.workspace = true
async-trait.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, optional = true }
aws-sdk-dynamodb = { workspace = true, optional = true }
aws-sdk-dynamodbstreams = { workspace = true, optional = true }
aws-types = { workspace = true, optional = true }

[dev-dependencies]
tokio.workspace = true
