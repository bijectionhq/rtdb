[package]
name = "rtdb-logkeeper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The RTDB multi log server and its quorum client: many named streams, epoch-fenced appends, write-quorum commit"

[features]
simulation = ["dep:journal-contract"]

[dependencies]
rtdb-types.workspace = true
rtdb-storage.workspace = true
journal-contract = { workspace = true, optional = true }
async-trait.workspace = true
bytes.workspace = true
crc32fast.workspace = true
fs2.workspace = true
futures.workspace = true
parking_lot.workspace = true
prost.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true

[dev-dependencies]
journal-contract = { workspace = true, features = ["conformance"] }
tempfile.workspace = true

[lints]
workspace = true
