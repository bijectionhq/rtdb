[package]
name = "rtdb-multi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "RTDB multi: many deployments on one shared, autoscaling cell"

[[bin]]
name = "rtdb-multi"
path = "src/main.rs"

[features]
dynamodb = ["rtdb-directory/dynamodb", "dep:aws-config"]

[dependencies]
aws-config = { version = "=1.13.0", optional = true }
rtdb-affinity.workspace = true
rtdb-columnar.workspace = true
rtdb-directory = { workspace = true, features = ["network"] }
rtdb-format.workspace = true
rtdb-logkeeper.workspace = true
rtdb-node.workspace = true
rtdb-query.workspace = true
rtdb-pgwire.workspace = true
rtdb-replication.workspace = true
rtdb-s3.workspace = true
rtdb-server.workspace = true
rtdb-storage.workspace = true
rtdb-types.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
futures.workspace = true
parking_lot.workspace = true
prost.workspace = true
prost-types.workspace = true
ring = "0.17"
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio-postgres = "0.7"
