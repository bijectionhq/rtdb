[package]
name = "rtdb-multi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "RTDB multi: many deployments on one shared, autoscaling cell"

[[bin]]
name = "rtdb-multi"
path = "src/main.rs"

[features]
dynamodb = ["rtdb-directory/dynamodb", "dep:aws-config", "dep:aws-sdk-dynamodb"]
s3-key-vault = ["dep:aws-config", "dep:aws-sdk-s3"]

[dependencies]
arrow-array.workspace = true
aws-config = { version = "=1.13.0", optional = true }
aws-sdk-dynamodb = { workspace = true, optional = true }
aws-sdk-s3 = { workspace = true, optional = true }
rtdb-affinity.workspace = true
rtdb-columnar.workspace = true
rtdb-directory = { workspace = true, features = ["network"] }
rtdb-format.workspace = true
rtdb-flight-sql.workspace = true
rtdb-index.workspace = true
rtdb-logkeeper.workspace = true
rtdb-maintenance.workspace = true
ordered-logkeeper.workspace = true
rtdb-node.workspace = true
rtdb-plan.workspace = true
rtdb-query.workspace = true
rtdb-pgwire.workspace = true
rtdb-replication.workspace = true
rtdb-s3 = { workspace = true, features = ["versioning"] }
rtdb-server.workspace = true
rtdb-storage.workspace = true
rtdb-trie.workspace = true
rtdb-tx.workspace = true
rtdb-types.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
futures.workspace = true
http.workspace = true
http-body-util = "=0.1.3"
hyper = { version = "=1.12.0", default-features = false, features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "=0.1.18", default-features = false, features = ["client-legacy", "http1", "http2", "tokio"] }
tonic = "=0.14.5"
openssl = { version = "=0.10.81", features = ["vendored"] }
parking_lot.workspace = true
prost.workspace = true
prost-types.workspace = true
ring = "0.17"
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-rustls = "=0.26.6"
tokio-util.workspace = true
tracing = "=0.1.44"

[dev-dependencies]
arrow-flight = { version = "=58.4.1", features = ["flight-sql"] }
tokio-postgres = "0.7"
