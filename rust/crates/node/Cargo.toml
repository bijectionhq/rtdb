[package]
name = "rtdb-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["search"]
multi = ["dep:rtdb-db"]
search = ["dep:rtdb-search", "dep:rtdb-text"]
fts-experiments = ["search", "rtdb-search/experiments"]
kafka = ["dep:rtdb-kafka"]
kafka-connect = ["kafka"]
s3 = ["dep:rtdb-s3", "rtdb-s3/versioning"]
azure = ["dep:rtdb-azure"]
gcs = ["dep:rtdb-gcs"]
pg-source = ["dep:rtdb-pg-source"]
all-backends = ["kafka", "kafka-connect", "s3", "azure", "gcs", "pg-source"]

[dependencies]
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-ipc.workspace = true
arrow-schema.workspace = true
arrow-select.workspace = true
base64.workspace = true
bytes.workspace = true
sha2.workspace = true
ring = "0.17"
hex = "0.4"
stacker.workspace = true
rtdb-types.workspace = true
rtdb-crypt.workspace = true
rtdb-columnar.workspace = true
rtdb-format.workspace = true
rtdb-storage.workspace = true
rtdb-store = { path = "../store" }
rtdb-index.workspace = true
rtdb-trie.workspace = true
rtdb-temporal.workspace = true
rtdb-plan.workspace = true
rtdb-sql.workspace = true
rtdb-xtql.workspace = true
rtdb-expr.workspace = true
rtdb-query.workspace = true
rtdb-tx.workspace = true
rtdb-db = { workspace = true, optional = true }
rtdb-replication.workspace = true
rtdb-maintenance.workspace = true
rtdb-kafka = { workspace = true, optional = true }
rtdb-s3 = { workspace = true, optional = true }
rtdb-azure = { workspace = true, optional = true }
rtdb-gcs = { workspace = true, optional = true }
rtdb-pg-source = { workspace = true, optional = true }
rtdb-spatial.workspace = true
rtdb-vector.workspace = true
rtdb-search = { workspace = true, optional = true }
rtdb-text = { workspace = true, optional = true }
async-trait.workspace = true
futures.workspace = true
prost-types.workspace = true
prost.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true
tracing.workspace = true

[dev-dependencies]
journal-contract.workspace = true
tantivy.workspace = true

[[example]]
name = "fts_architecture_bench"
required-features = ["search"]

[lints]
workspace = true
