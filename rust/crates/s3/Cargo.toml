[package]
name = "rtdb-s3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
versioning = ["dep:aws-sdk-s3", "dep:base64", "dep:bytes", "dep:ring"]

[dependencies]
rtdb-storage = { workspace = true, features = ["remote-cache-http"] }
rtdb-types.workspace = true
rtdb-format.workspace = true
object_store = { workspace = true, features = ["aws"] }
serde.workspace = true
serde_json.workspace = true
url.workspace = true
async-trait.workspace = true
bytes = { workspace = true, optional = true }
uuid.workspace = true
base64 = { workspace = true, optional = true }
ring = { version = "0.17", optional = true }
tokio.workspace = true
aws-config = "=1.13.0"
aws-credential-types = "=1.3.1"
aws-sdk-s3 = { workspace = true, optional = true }
aws-sdk-sts = { version = "=1.126.0", default-features = false }

[lints]
workspace = true
