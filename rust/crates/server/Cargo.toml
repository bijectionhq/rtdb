[package]
name = "rtdb-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "rtdb"
path = "src/main.rs"

[features]
default = []
multi = ["rtdb-node/multi", "dep:journal-contract", "dep:rtdb-db", "dep:rtdb-journal-logkeeper", "dep:tempfile", "dep:sha2"]
kafka = ["rtdb-node/kafka", "dep:rtdb-kafka", "rtdb-metrics/kafka"]
kafka-connect = ["kafka", "rtdb-node/kafka-connect"]
s3 = ["rtdb-node/s3", "dep:rtdb-s3"]
azure = ["rtdb-node/azure", "dep:rtdb-azure"]
gcs = ["rtdb-node/gcs"]
pg-source = ["rtdb-node/pg-source", "rtdb-metrics/pg-source", "dep:rtdb-pg-source"]
cloudwatch = ["dep:aws-config", "dep:aws-sdk-cloudwatch"]
all-backends = ["kafka", "kafka-connect", "s3", "azure", "gcs", "pg-source", "cloudwatch", "multi"]

[dependencies]
async-trait.workspace = true
chrono.workspace = true
aws-config = { version = "=1.13.0", optional = true }
aws-sdk-cloudwatch = { version = "=1.136.0", optional = true }
arrow-array.workspace = true
arrow-schema.workspace = true
serde.workspace = true
rtdb-node.workspace = true
rtdb-crypt.workspace = true
journal-contract = { workspace = true, optional = true }
rtdb-db = { path = "../db", optional = true }
rtdb-journal-logkeeper = { path = "../journal-logkeeper", optional = true }
tempfile = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
rtdb-tx.workspace = true
rtdb-query.workspace = true
rtdb-auth.workspace = true
rtdb-pgwire.workspace = true
rtdb-types.workspace = true
rtdb-tls.workspace = true
rtdb-columnar.workspace = true
rtdb-format.workspace = true
rtdb-plan.workspace = true
rtdb-expr.workspace = true
rtdb-trie.workspace = true
rtdb-xtql.workspace = true
rtdb-metrics.workspace = true
rtdb-flight-sql.workspace = true
rtdb-maintenance.workspace = true
rtdb-storage.workspace = true
rtdb-kafka = { workspace = true, optional = true }
rtdb-s3 = { workspace = true, optional = true }
rtdb-azure = { workspace = true, optional = true }
rtdb-pg-source = { workspace = true, optional = true }
regex.workspace = true
uuid.workspace = true
bytes.workspace = true
http.workspace = true
http-body-util = "=0.1.3"
hyper = { version = "=1.12.0", features = ["http1", "server"] }
hyper-util = { version = "=0.1.18", features = ["tokio"] }
tokio.workspace = true
tokio-util.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
url.workspace = true
tokio-rustls = "=0.26.6"
zeroize = "1.8"
futures.workspace = true
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls"] }
fs2.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
