syntax = "proto3";
package rtdb.admin.v1;

import "rtdb.v1.proto";

// DoAction types use rtdb.admin.v1.<verb> with serialized protobuf request and result bodies.
service Admin {
  rpc CreateDeployment(CreateDeploymentRequest) returns (Deployment);
  rpc DeleteDeployment(DeleteDeploymentRequest) returns (ErasureProof);
  rpc ForkDeployment(ForkDeploymentRequest) returns (Deployment);
  rpc ExportCheckpoint(ExportCheckpointRequest) returns (CheckpointExport);
  rpc RestoreDeployment(RestoreDeploymentRequest) returns (Deployment);
}
message CreateDeploymentRequest {
  string deployment = 1;
  // The owner's 16-byte nonzero UUID. When omitted, use the catalog identity.
  optional bytes incarnation = 2;
}
message Deployment {
  string deployment = 1;
  rtdb.v1.Basis basis = 2;
  // The attached database incarnation confirmed by Create, Restore or Fork.
  bytes incarnation = 3;
}
message DeleteDeploymentRequest { string deployment = 1; }
message ErasureProof { string deployment = 1; bytes proof = 2; sint64 unreadable_by_micros = 3; }
message ForkDeploymentRequest {
  string deployment = 1;
  string from = 2;
  rtdb.v1.Basis basis = 3;
  bytes pin = 4;
  optional sint64 retain_until_micros = 5;
}
message ExportCheckpointRequest {
  string deployment = 1;
  rtdb.v1.Basis basis = 2;
  // Stable nonzero UUID bytes supplied by the caller for exact retries.
  bytes pin = 3;
  optional sint64 retain_until_micros = 4;
}
message CheckpointExport { bytes checkpoint = 1; rtdb.v1.Basis basis = 2; }
message RestoreDeploymentRequest {
  string deployment = 1;
  bytes checkpoint = 2;
  string from = 3;
}
