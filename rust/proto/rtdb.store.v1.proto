syntax = "proto3";

// Versioned ordered bytes: the whole store contract.
// The store knows no labels, worlds, indexes or schemas. Its callers encode
// them as keys and decide what a read covers; the store only orders bytes,
// versions and stamps commits, checks range intersection and judges an
// append's clock window.
//
// Ordinary requests use Flight DoAction on an unscoped database route. Each
// reply is one Flight result holding the encoded reply message.
//   rtdb.store.v1.Read   ReadRequest   -> ReadReply
//   rtdb.store.v1.Append AppendRequest -> AppendReply
//   rtdb.store.v1.Watch  WatchRequest  -> WatchReply
//   rtdb.store.v1.Rank   RankRequest   -> RankReply
//   rtdb.store.v1.StorageSizes StorageSizesRequest -> StorageSizesReply
//   rtdb.store.v1.FenceWriter FenceWriterRequest -> FenceWriterReply
//   rtdb.store.v1.ClaimWriter ClaimWriterRequest -> ClaimWriterReply
//   rtdb.store.v1.PurgeFloor PurgeFloorRequest -> PurgeFloorReply (Multi writer)
//
// A version is a commit position within one store incarnation. A restore or a
// reset starts a new incarnation; a request naming another incarnation fails
// with FAILED_PRECONDITION and the caller starts again from a fresh read.
//
// A stamp is what the store assigns a committing append under its ordering:
// its version, and its time in microseconds: the writer's clock sampled at the
// ordering point, or one microsecond past the predecessor's when the sample
// does not exceed it, as XTDB smooths system time. Micros strictly increase
// along versions, so no two commits share a time. Its 16-byte encoding is
// the micros big-endian with the sign bit flipped, then the version big-endian,
// so encoded stamps sort in commit order.
package rtdb.store.v1;

// A half-open key range [start, end). An absent end is unbounded.
message KeyRange {
  bytes start = 1;
  optional bytes end = 2;
}

message Entry {
  bytes key = 1;
  // Absent under PROJECTION_KEYS.
  optional bytes value = 2;
  // The version that wrote this value.
  uint64 written = 3;
}

message ReadRequest {
  repeated KeyRange ranges = 1;
  // Absent reads the latest committed version.
  optional uint64 at = 2;
  // Required whenever at is present.
  bytes incarnation = 3;
  // Resume strictly after this key, within the range it falls in.
  optional bytes after = 4;
  // Maximum entries per range; the server caps it.
  uint32 limit = 5;
  // What each entry returns of its value. A projection equals reading the
  // whole value and projecting it afterwards.
  Projection projection = 6;
  // For PROJECTION_SLICE: the bytes [slice_start, slice_start + slice_len) of
  // each value, clipped to its length.
  uint32 slice_start = 7;
  uint32 slice_len = 8;
  reserved 9;
  // Return only entries whose whole value passes this filter, in the wire form
  // of Bijection's ValueFilter (vendor/bijection-store-filter).
  // Evaluated before the projection; limit counts returned entries.
  // A filter never narrows what the read covers.
  optional bytes filter = 10;
  // Descend by key: after resumes strictly before its key, limit counts from
  // the range's end, and resume names the smallest key returned. A reverse
  // read equals the ascending read at the same version reversed.
  bool reverse = 11;
}

enum Projection {
  PROJECTION_VALUES = 0;
  PROJECTION_KEYS = 1;
  PROJECTION_SLICE = 2;
}

message RangePage {
  repeated Entry entries = 1;
  // Present when the limit stopped this range: resume after this key.
  optional bytes resume = 2;
  reserved 3;
}

message ReadReply {
  bytes incarnation = 1;
  // The version every page was read at.
  uint64 at = 2;
  // One page per requested range, in request order.
  repeated RangePage pages = 3;
  // The store's clock sample in microseconds when this read opened, giving the
  // host one clock domain with commit stamps.
  optional int64 clock_micros = 4;
}

message Write {
  bytes key = 1;
  // Absent deletes the key.
  optional bytes value = 2;
  // The offset of 16 zero bytes in key that the store overwrites with the
  // append's encoded stamp. It lies at or past the key's partition prefix
  // (a big-endian u16 length, then that many bytes).
  optional uint32 key_stamp = 3;
  // The same, in value.
  optional uint32 value_stamp = 4;
}

// An atomic bounded-counter update over a 64-bit signed big-endian integer
// stored at key (absent key = 0). At the append's version, the store adds
// delta and refuses the whole append if the sum leaves [min, max] or overflows
// i64. Concurrent Bounds on the same key never conflict with each other.
message Bound {
  bytes key = 1;
  int64 delta = 2;
  int64 min = 3;
  int64 max = 4;
}

// The stamp's micros must lie in [not_before, before). Absent bounds are
// unbounded.
message Window {
  optional int64 not_before = 1;
  optional int64 before = 2;
}

message Stamp {
  int64 micros = 1;
  uint64 version = 2;
}

enum Side {
  SIDE_UNSPECIFIED = 0;
  // Before not_before: the window has not opened.
  SIDE_EARLY = 1;
  // At or past before: the window has closed.
  SIDE_LATE = 2;
}

message AppendRequest {
  // Idempotency key, 16 to 64 bytes. A retried append returns its first reply.
  bytes key = 1;
  bytes incarnation = 2;
  // The version the reads were taken at.
  uint64 since = 3;
  // Fails when a write committed after since intersects any of these.
  repeated KeyRange reads = 4;
  // A placeholder that lies outside its bytes, over non-zero bytes or inside
  // the key's partition prefix, a value placeholder on a delete, and a
  // stamped key that could land on another write's key (equal length and
  // equal bytes outside both placeholders) fail with INVALID_ARGUMENT
  // before anything is judged.
  repeated Write writes = 5;
  // Judged after the reads, against the clock sample the stamp carries.
  // Absent is unbounded; an empty window fails with INVALID_ARGUMENT.
  optional Window window = 6;
  // Atomic bounded-counter checks and updates evaluated at the append's
  // version after the reads and window. A bound with min > max fails with
  // INVALID_ARGUMENT before anything is ordered.
  repeated Bound bounds = 7;
  // Derived writes (vendor/bijection-store-derive, T3): each entry is an
  // encoded store_read::derive::Derive. Applied in order after the reads, window
  // and bounds are judged and before plain writes. Applying one never changes
  // the append's outcome; the unique claims they make are judged once all
  // apply, on their filled keys (claimed). Emitted writes do not count toward
  // any request size limit.
  repeated bytes derives = 8;
  // Optional SHA-256 digest of Bijection's store_read::derive source; when
  // present it must match RTDB's vendored DERIVE_DIGEST or the append fails
  // with rtdb.store/derive-version.
  optional string derive_digest = 9;
  // Inclusive oldest committed basis the ordered append requires to remain
  // available. It uses this request's incarnation and must be at or below since.
  optional uint64 required_basis = 11;
  // The writer identity and epoch assigned for this incarnation.
  optional WriterFence writer_fence = 12;
}

message WriterFence {
  uint64 epoch = 1;
  bytes writer = 2;
  uint64 generation = 3;
  bytes claim = 4;
}

// The timed writer handshake offers and echoes x-rtdb-store-timed-append: 1
// and x-rtdb-store-timed-incarnation-bin with the exact 16-byte incarnation.
// Select the database by its bare name on that bearer.
// Use Flight DoExchange with x-rtdb-store-exchange: timed-append-v1.
// Each envelope is a single FlightData body without Arrow metadata.
// Send Begin, wait for Prepared, send Confirm and half-close, then read
// Committed. Closing before Confirm prevents dispatch.
// All three appends carry the same Store writer fence when one is installed.
message TimedAppendInput {
  oneof message {
    TimedAppendBegin begin = 1;
    AppendRequest confirm = 2;
  }
}

message TimedAppendBegin {
  AppendRequest preview = 1;
  AppendRequest effect = 2;
  bytes application_root = 3;
  int64 decision_before_micros = 4;
  int64 journal_before_micros = 5;
  bytes receiver_certificate_sha256 = 6;
}

message TimedAppendOutput {
  oneof message {
    TimedAppendCommitment prepared = 1;
    TimedAppendReceipt committed = 2;
  }
}

message TimedAppendCommitment {
  bytes catalog = 1;
  // Exact 16-byte, big-endian journal stream ID.
  bytes stream = 2;
  uint64 writer_epoch = 3;
  uint64 lsn = 4;
  bytes payload_sha256 = 5;
  int64 journal_before_micros = 6;
  bytes receiver_certificate_sha256 = 7;
}

message TimedAppendReceipt {
  AppendReply reply = 1;
  TimedAppendCommitment original = 2;
  int64 quorum_sync_at_micros = 3;
  bytes evidence_sha256 = 4;
}

message FenceWriterRequest {
  bytes incarnation = 1;
  uint64 epoch = 2;
  // Obsolete claim field. A populated field is refused.
  optional bytes writer = 3;
}

message FenceWriterReply {
  bytes incarnation = 1;
  uint64 epoch = 2;
  optional bytes writer = 3;
}

message ClaimWriterRequest {
  bytes incarnation = 1;
  uint64 epoch = 2;
  bytes assignment = 3;
  // One opaque 16-byte identity per claim. Retries reuse it.
  bytes attempt = 4;
}

message ClaimWriterReply {
  ClaimWriterRequest claim = 1;
  // The ordered position of this claim within the incarnation.
  uint64 generation = 2;
}

// Returned in x-rtdb-store-access-denial-bin on a denied access probe.
message StoreAccessDenial {
  string database = 1;
  bytes incarnation = 2;
  string principal = 3;
}

message AppendReply {
  bytes incarnation = 1;
  oneof outcome {
    // Committed with this stamp; every placeholder received it.
    Stamp committed = 2;
    // The index of the first read range a later write intersected.
    uint32 conflict = 3;
    // An append with no writes or bounds validated its reads through this
    // version: its own record, which writes nothing. Like a commit, a conflict
    // and a bound refusal, it is a receipt, so a retry under the same key
    // returns it.
    uint64 validated = 4;
    // The clock sample fell outside the window. Nothing was written and no
    // receipt was kept: a retry under the same key is judged again.
    Side outside = 5;
    // The index of the first bound whose sum left [min, max] or overflowed.
    // Nothing was written; recorded as a receipt under the append's key.
    uint32 bound = 6;
    // The index of the first derive whose unique claim, filled at the stamp,
    // counted a second claimant at an instant of its coverage once the
    // append's derives applied (store_derive::claim_exceeded). Nothing was
    // written; recorded as a receipt under the append's key.
    uint32 claimed = 7;
  }
}

message WatchRequest {
  repeated KeyRange ranges = 1;
  uint64 after = 2;
  bytes incarnation = 3;
  // Maximum wait; the server caps it.
  uint64 wait_millis = 4;
}

message WatchReply {
  bytes incarnation = 1;
  // The first version after `after` that wrote into a range, if one exists.
  optional uint64 touched = 2;
  // Every version through this one was inspected.
  uint64 through = 3;
}

// A ranked read run next to the data (`rtdb.store.v1.Rank`): text BM25,
// exact cosine, spatial predicates and nearest, as Bijection's vendored
// `store_read::rank` (vendor/bijection). `program` is that crate's own
// encoding of the request: its frames (label-partition key prefixes,
// versions and cuts, never labels), the query and the RANK_DIGEST it
// expects. The store runs the program over its ordered entries and adds no
// semantics; a program for other ranking code fails with
// `rtdb.store/rank-version`, and a sealed partition with
// `rtdb.store/rank-sealed`.
message RankRequest {
  bytes incarnation = 1;
  bytes program = 2;
}

message RankReply {
  bytes incarnation = 1;
  // `store_read::rank::RankReply`: the window (or a split read's part) and
  // the ranges each partition consulted.
  bytes reply = 2;
}

message StorageSizesRequest {
  // Empty asks the server to identify the current incarnation.
  bytes incarnation = 1;
  optional uint64 reconcile_epoch = 2;
}

message StorageSizesReply {
  bytes incarnation = 1;
  // Present only for a complete rollup.
  SizeSnapshot snapshot = 2;
}

message SizeSnapshot {
  uint64 at = 1;
  repeated SizeBucket buckets = 2;
}

message SizeBucket {
  // Structural key family (16 or 17) and its opaque 16-byte tablet.
  uint32 family = 1;
  bytes tablet = 2;
  uint64 key_bytes = 3;
  uint64 value_bytes = 4;
  uint64 presences = 5;
}

// The local Multi writer orders rtdb.store.v1.PurgeFloor for its attached incarnation.
// The effect covers the entire store incarnation and requires a verified credential with unscoped database write access.
message PurgeFloorRequest {
  // Exactly 16 bytes, identifying the store incarnation observed by the planner.
  bytes incarnation = 1;
  // Required, including when zero. The retained Version of every guard observation.
  optional uint64 since = 2;
  // Required, including when zero. Versions strictly below this bound may become eligible for reclamation.
  // This Version must be at or below since.
  optional uint64 keep_from = 3;
  // Nonempty, in the planner's order, including retention and writer-fence guards.
  // A write after since intersecting any guard refuses publication.
  repeated KeyRange reads = 4;
}

message PurgeFloorReply {
  bytes incarnation = 1;
  // Present on success and equal to the request's keep_from. The durable floor is at least this Version.
  // Physical collection follows the writer's checkpoint and retention policy.
  // Every retry must pass current writer, basis and guard admission, even when the floor already covers the request.
  optional uint64 keep_from = 2;
}

// Authored contract for rtdb.store.v1.HoldVersion on the current Multi writer.
message HoldVersionRequest {
  // Exact 16-byte physical incarnation previously observed by the reader.
  bytes incarnation = 1;
  oneof operation {
    RetainVersion retain = 2;
    HeldVersionKey reopen = 3;
    HeldVersionKey release = 4;
  }
}

message RetainVersion {
  // Required, including zero. This exact Version must still be retained.
  optional uint64 at = 1;
  // Required. Exclusive deadline on the writer clock, in microseconds.
  optional int64 expires_at_micros = 2;
}

message HeldVersionKey {
  // The opaque 16-byte identity assigned at admission.
  bytes hold_id = 1;
  optional uint64 at = 2;
}

message HeldVersion {
  HeldVersionKey key = 1;
  optional int64 expires_at_micros = 2;
}

message HoldVersionReply {
  bytes incarnation = 1;
  oneof outcome {
    HeldVersion held = 2;
    HeldVersionKey released = 3;
  }
}
