syntax = "proto3";

// Versioned ordered bytes: the whole store contract.
// The store knows no labels, worlds, indexes or schemas. Its callers encode
// them as keys and decide what a read covers; the store only orders bytes,
// versions and stamps commits, checks range intersection and judges an
// append's clock window.
//
// Every request is a Flight DoAction on an unscoped database route; each reply
// is one Flight result holding the encoded reply message.
//   rtdb.store.v1.Read   ReadRequest   -> ReadReply
//   rtdb.store.v1.Append AppendRequest -> AppendReply
//   rtdb.store.v1.Watch  WatchRequest  -> WatchReply
//
// A version is a commit position within one store incarnation. A restore or a
// reset starts a new incarnation; a request naming another incarnation fails
// with FAILED_PRECONDITION and the caller starts again from a fresh read.
//
// A stamp is what the store assigns a committing append under its ordering:
// its version, and the writer's clock sampled at the ordering point, in
// microseconds. Micros never decrease along versions and are never raised to
// a predecessor's: a clock reading behind the last commit is waited out. Its
// 16-byte encoding is the micros big-endian with the sign bit flipped, then
// the version big-endian, so encoded stamps sort in commit order.
package rtdb.store.v1;

// A half-open key range [start, end). An absent end is unbounded.
message KeyRange {
  bytes start = 1;
  optional bytes end = 2;
}

message Entry {
  bytes key = 1;
  // Absent under PROJECTION_KEYS.
  optional bytes value = 2;
  // The version that wrote this value.
  uint64 written = 3;
}

message ReadRequest {
  repeated KeyRange ranges = 1;
  // Absent reads the latest committed version.
  optional uint64 at = 2;
  // Required whenever at is present.
  bytes incarnation = 3;
  // Resume strictly after this key, within the range it falls in.
  optional bytes after = 4;
  // Maximum entries per range; the server caps it.
  uint32 limit = 5;
  // What each entry returns of its value. A projection equals reading the
  // whole value and projecting it afterwards.
  Projection projection = 6;
  // For PROJECTION_SLICE: the bytes [slice_start, slice_start + slice_len) of
  // each value, clipped to its length.
  uint32 slice_start = 7;
  uint32 slice_len = 8;
  reserved 9;
  // Return only entries whose whole value passes this filter, in the wire form
  // of Bijection's ValueFilter (vendor/bijection-store-filter).
  // Evaluated before the projection; limit counts returned entries.
  // A filter never narrows what the read covers.
  optional bytes filter = 10;
  // Descend by key: after resumes strictly before its key, limit counts from
  // the range's end, and resume names the smallest key returned. A reverse
  // read equals the ascending read at the same version reversed.
  bool reverse = 11;
}

enum Projection {
  PROJECTION_VALUES = 0;
  PROJECTION_KEYS = 1;
  PROJECTION_SLICE = 2;
}

message RangePage {
  repeated Entry entries = 1;
  // Present when the limit stopped this range: resume after this key.
  optional bytes resume = 2;
  reserved 3;
}

message ReadReply {
  bytes incarnation = 1;
  // The version every page was read at.
  uint64 at = 2;
  // One page per requested range, in request order.
  repeated RangePage pages = 3;
}

message Write {
  bytes key = 1;
  // Absent deletes the key.
  optional bytes value = 2;
  // The offset of 16 zero bytes in key that the store overwrites with the
  // append's encoded stamp. It lies at or past the key's partition prefix
  // (a big-endian u16 length, then that many bytes).
  optional uint32 key_stamp = 3;
  // The same, in value.
  optional uint32 value_stamp = 4;
}

// The stamp's micros must lie in [not_before, before). Absent bounds are
// unbounded.
message Window {
  optional int64 not_before = 1;
  optional int64 before = 2;
}

message Stamp {
  int64 micros = 1;
  uint64 version = 2;
}

enum Side {
  SIDE_UNSPECIFIED = 0;
  // Before not_before: the window has not opened.
  SIDE_EARLY = 1;
  // At or past before: the window has closed.
  SIDE_LATE = 2;
}

message AppendRequest {
  // Idempotency key, 16 to 64 bytes. A retried append returns its first reply.
  bytes key = 1;
  bytes incarnation = 2;
  // The version the reads were taken at.
  uint64 since = 3;
  // Fails when a write committed after since intersects any of these.
  repeated KeyRange reads = 4;
  // A placeholder that lies outside its bytes, over non-zero bytes or inside
  // the key's partition prefix, a value placeholder on a delete, and a
  // stamped key that could land on another write's key (equal length and
  // equal bytes outside both placeholders) fail with INVALID_ARGUMENT
  // before anything is judged.
  repeated Write writes = 5;
  // Judged after the reads, against the clock sample the stamp carries.
  // Absent is unbounded; an empty window fails with INVALID_ARGUMENT.
  optional Window window = 6;
}

message AppendReply {
  bytes incarnation = 1;
  oneof outcome {
    // Committed with this stamp; every placeholder received it.
    Stamp committed = 2;
    // The index of the first read range a later write intersected.
    uint32 conflict = 3;
    // An append with no writes validated its reads through this version: its
    // own record, which writes nothing. Like a commit and a conflict, it is a
    // receipt, so a retry under the same key returns it.
    uint64 validated = 4;
    // The clock sample fell outside the window. Nothing was written and no
    // receipt was kept: a retry under the same key is judged again.
    Side outside = 5;
  }
}

message WatchRequest {
  repeated KeyRange ranges = 1;
  uint64 after = 2;
  bytes incarnation = 3;
  // Maximum wait; the server caps it.
  uint64 wait_millis = 4;
}

message WatchReply {
  bytes incarnation = 1;
  // The first version after `after` that wrote into a range, if one exists.
  optional uint64 touched = 2;
  // Every version through this one was inspected.
  uint64 through = 3;
}
