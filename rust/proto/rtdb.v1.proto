syntax = "proto3";
package rtdb.v1;

import "google/protobuf/empty.proto";

// Query and Changes use DoGet with google.protobuf.Any tickets.
// Each reply sends Arrow Flight schema and batch data, followed by a metadata-only FlightData carrying its protobuf trailer.
// The remaining verbs use DoAction with the rtdb.v1.<verb> type and the serialized protobuf request and result bodies.
service Rtdb {
  rpc Capabilities(CapabilitiesRequest) returns (CapabilitiesResponse);
  rpc Query(QueryRequest) returns (stream QueryFrame);
  rpc Transact(TransactRequest) returns (Receipt);
  rpc TxStatus(TxStatusRequest) returns (Receipt);
  rpc Changes(ChangesRequest) returns (stream ChangesFrame);
}

// Opaque cut ordered within the database incarnation that issued it.
message Basis { bytes value = 1; }
// Opaque authenticated read evidence scoped to the branch and basis that issued it.
message Claim { bytes value = 1; }
message At {
  oneof selection {
    google.protobuf.Empty latest = 1;
    Basis at_least = 2;
    Basis exactly = 3;
    google.protobuf.Empty linearizable = 4;
    sint64 as_of_micros = 5;
  }
}
enum Layer { LAYER_MERGED = 0; LAYER_LOCAL = 1; }
message Source {
  string branch = 1;
  // Omission selects Latest.
  At at = 2;
  Layer layer = 3;
}
message Limits {
  uint32 max_page_rows = 1;
  uint32 max_change_groups = 2;
  uint64 max_wait_millis = 3;
  uint32 min_key_bytes = 4;
  uint32 max_key_bytes = 5;
}
message CapabilitiesRequest {}
message CapabilitiesResponse {
  string api = 1;
  repeated string features = 2;
  Limits limits = 3;
  sint64 server_time_micros = 4;
}
message Page {
  uint32 limit = 1;
  // Resume with the same Source, SQL, parameters and track flag.
  bytes after = 2;
}
message QueryRequest {
  Source source = 1;
  // Read-only SQL. Source supplies the statement-wide read settings.
  string sql = 2;
  // An Arrow IPC stream with exactly one batch containing one positional parameter row.
  optional bytes params_ipc = 3;
  bool track = 4;
  Page page = 5;
  // Ask for an authenticated receiver sample on the first page of this read.
  bool observe_receiver_clock = 6;
  // Request a custody proof on the configured original owner route.
  bool custody_release_evidence = 7;
  // Require a tracked exact cut whose full applied branch view is proved clear.
  bool require_clear_rank_input = 8;
  // Obtain the comparable position of this Query's selected native cut.
  // Available only on an unscoped native database route.
  bool observe_applied_position = 9;
  // Inspect persisted ranked artefacts for a tracked, clear exact-cut catalog read.
  bool verify_ranked_artefacts = 10;
}
message QueryTrailer {
  Basis basis = 1;
  sint64 system_time_micros = 2;
  Claim claim = 3;
  optional bytes next = 4;
  ReceiverClockObservation receiver_clock = 5;
  optional bytes custody_release_proof = 6;
  // Present only on the authenticated Original owner's proof route. The
  // sealed proof and this inventory cover the same complete contributor set.
  CustodyReadInventory custody_release_inventory = 7;
  // Compare positions only within the same database incarnation and branch.
  optional uint64 applied_position = 8;
  // Present for observe_applied_position on an assigned Multi follower.
  FollowerProgress follower_progress = 9;
}
message FollowerProgress {
  string database = 1;
  bytes incarnation = 2;
  uint64 placement_epoch = 3;
  bytes assignment = 4;
  string endpoint = 5;
  Basis writer_head = 6;
  uint64 writer_head_position = 7;
}
message CustodyReadInventory {
  repeated CustodyReadContributor contributors = 1;
}
message CustodyReadContributor {
  bytes group = 1;
  bytes original = 2;
  bytes occurrence = 3;
  bytes receipt_key = 4;
  Basis written_basis = 5;
  sint64 system_time_micros = 6;
  string table = 7;
  // Canonical entity handle bytes. A string uses tag zero followed by UTF-8.
  bytes row_id = 8;
  sint64 valid_from_micros = 9;
  sint64 valid_to_micros = 10;
  bytes carrier_sha256 = 11;
  // Physical authoring branch, including when the Query inherits the row.
  string branch = 12;
  uint64 ordinal = 13;
  bytes placement_id = 14;
  optional bytes reservation_sha256 = 15;
  optional bytes link_sha256 = 16;
}
message ReceiverClockObservation {
  // A sample from the installed receiver clock. QueryTrailer.system_time_micros names the selected cut.
  sint64 observed_at_micros = 1;
  bytes proof = 2;
}
message QueryFrame {
  oneof frame {
    bytes arrow_ipc = 1;
    QueryTrailer trailer = 2;
  }
}
message Window { optional sint64 not_before_micros = 1; optional sint64 before_micros = 2; }
message TransactRequest {
  bytes key = 1;
  repeated string require = 2;
  Window window = 3;
  repeated Guard guards = 4;
  repeated Op ops = 5;
  repeated Op otherwise = 6;
  // Preconditions on the original state. CountAtMost uses WHEN_BEFORE here.
  repeated Guard requires = 7;
}
message TxStatusRequest { bytes key = 1; }
message Guard {
  oneof guard {
    Claim unchanged = 1;
    Version version = 2;
    CountAtMost count_at_most = 3;
  }
}
message Version {
  string branch = 1;
  string table = 2;
  Cell id = 3;
  optional sint64 valid_at_micros = 4;
  oneof expect {
    google.protobuf.Empty absent = 5;
    google.protobuf.Empty present = 6;
    Basis written = 7;
  }
}
enum When { WHEN_BEFORE = 0; WHEN_AFTER = 1; }
message CountAtMost {
  string branch = 1;
  string table = 2;
  string index = 3;
  Cell lower = 4;
  Cell upper = 5;
  optional sint64 valid_at_micros = 6;
  uint64 n = 7;
  When when = 8;
}
message Cell {
  oneof value {
    // An Arrow IPC stream with exactly one scalar cell, including typed null.
    bytes arrow_ipc = 1;
    google.protobuf.Empty tx_time = 2;
    google.protobuf.Empty tx_basis = 3;
    // A signed offset from the transaction time, used in Put valid-time bounds.
    sint64 tx_time_offset_micros = 4;
  }
}
message Interval {
  optional sint64 from_micros = 1;
  optional sint64 to_micros = 2;
  optional sint64 from_tx_offset_micros = 3;
  optional sint64 to_tx_offset_micros = 4;
}
message Row {
  map<string, Cell> cells = 1;
  // A 16-byte nonzero database-local custody group. Empty leaves the row unbound.
  bytes custody_group = 2;
  // Cells in these columns are sealed before the transaction is persisted.
  repeated string protected_columns = 3;
}
message Put { string branch = 1; string table = 2; repeated Row rows = 3; bool if_absent = 4; }
message Delete { string branch = 1; string table = 2; repeated Cell ids = 3; Interval valid = 4; }
message Erase { optional string branch = 1; string table = 2; repeated Cell ids = 3; }
message Schema { bytes arrow_schema_ipc = 1; }
enum IndexKind {
  INDEX_KIND_UNSPECIFIED = 0;
  INDEX_KIND_ORDERED = 1;
  INDEX_KIND_SEARCH = 2;
  INDEX_KIND_SPATIAL = 3;
  INDEX_KIND_VECTOR = 4;
}
message SearchIndexOptions { string analyzer = 1; bool history = 2; }
message SpatialIndexOptions { string geometry_encoding = 1; }
message VectorIndexOptions { string method = 1; uint32 dimensions = 2; double recall = 3; }
message Index {
  string name = 1;
  IndexKind kind = 2;
  // For spatial and vector indexes the first column is the value and the rest are equality partitions.
  repeated string columns = 3;
  oneof options {
    SearchIndexOptions search = 4;
    SpatialIndexOptions spatial = 5;
    VectorIndexOptions vector = 6;
  }
}
message Ttl { optional uint64 duration_micros = 1; }
message CountRangeConstraint {
  string index = 1;
  Cell lower = 2;
  Cell upper = 3;
  optional sint64 valid_at_micros = 4;
  uint64 n = 5;
}
message GroupedCountConstraint {
  string column = 1;
  optional uint32 prefix_bytes = 2;
  map<string, bytes> equals = 3;
  optional sint64 valid_at_micros = 4;
  uint64 n = 5;
}
message Constraint {
  string name = 1;
  string expression = 2;
  oneof change {
    CountRangeConstraint count_range = 3;
    google.protobuf.Empty drop = 4;
    GroupedCountConstraint grouped_count = 5;
  }
}
message Visibility { string column = 1; }
message Declare {
  string table = 1;
  oneof change {
    Schema schema = 2;
    Index index = 3;
    Ttl ttl = 4;
    Constraint constraint = 5;
    google.protobuf.Empty drop = 6;
    Visibility visibility = 7;
    google.protobuf.Empty single_label_per_tx = 8;
  }
}
message BranchBasis { string branch = 1; Basis basis = 2; }
message Fork { string child = 1; BranchBasis from = 2; bool writable = 3; optional sint64 expires_at_micros = 4; }
message Renew { string branch = 1; sint64 expires_at_micros = 2; }
message Merge { string from = 1; string into = 2; }
message DropBranch { string branch = 1; }
message CreateCustodyGroup { bytes group = 1; }
message RevokeCustodyGroup {
  bytes group = 1;
  // Exact inventory digest selected from xt.custody_groups. A new placement
  // invalidates the plan and refuses the whole transaction.
  bytes inventory_sha256 = 2;
}
message CustodyPlacementTarget {
  string branch = 1;
  string table = 2;
  Cell id = 3;
  // Relative bounds are evaluated at the accepting PlaceCustodyRow clock.
  Interval valid = 4;
}
message ReserveCustodyPlacement {
  bytes group = 1;
  bytes original_occurrence_sha256 = 2;
  bytes source_occurrence_sha256 = 3;
  bytes destination = 4;
  bytes link = 5;
  CustodyPlacementTarget target = 6;
  bytes review_sha256 = 7;
  bytes carrier_sha256 = 8;
  bytes link_sha256 = 9;
}
message PlaceCustodyRow {
  string branch = 1;
  string table = 2;
  Row row = 3;
  bytes placement_id = 4;
  // A prior ordered reservation. Mutually exclusive with derived_reservation.
  optional bytes reservation_sha256 = 5;
  string carrier_column = 6;
  // Required for a reserved placement. Both named columns are protected binary cells.
  optional string link_column = 7;
  DerivedCustodyReservation derived_reservation = 8;
}
message DerivedCustodyReservation {
  // The original placement ID in the same group, ordered earlier in this arm.
  bytes original_placement_id = 1;
  bytes link = 2;
  bytes review_sha256 = 3;
  bytes carrier_sha256 = 4;
  bytes link_sha256 = 5;
}
message Op {
  oneof op {
    Put put = 1;
    Delete delete = 2;
    Erase erase = 3;
    Declare declare = 4;
    Fork fork = 5;
    Renew renew = 6;
    Merge merge = 7;
    DropBranch drop_branch = 8;
    CreateCustodyGroup create_custody_group = 9;
    RevokeCustodyGroup revoke_custody_group = 10;
    ReserveCustodyPlacement reserve_custody_placement = 11;
    PlaceCustodyRow place_custody_row = 12;
  }
}
message Otherwise { repeated uint32 failed = 1; }
message Erasure { sint64 unreadable_by_micros = 1; }
message Receipt {
  bytes key = 1;
  Basis basis = 2;
  sint64 system_time_micros = 3;
  oneof outcome {
    google.protobuf.Empty then = 4;
    Otherwise otherwise = 5;
    Error refused = 6;
  }
  bool replayed = 7;
  Erasure erasure = 8;
}
enum Order { ORDER_ASCENDING = 0; ORDER_DESCENDING = 1; }
enum Images {
  IMAGES_NONE = 0;
  IMAGES_KEYS = 1;
  IMAGES_BEFORE = 2;
  IMAGES_AFTER = 3;
  IMAGES_BOTH = 4;
}
message ChangesRequest {
  string branch = 1;
  repeated string tables = 2;
  // Exclusive lower bound. Omission selects the beginning of history.
  Basis after = 3;
  // Inclusive upper bound. Omission selects the available head.
  Basis until = 4;
  Order order = 5;
  Images images = 6;
  // Maximum number of whole system-time groups.
  uint32 limit = 7;
  optional uint64 wait_millis = 8;
  // Requires the changes.progress-only capability and IMAGES_NONE.
  // Return the schema and normal coverage trailer with no row batches.
  bool progress_only = 9;
  // Append the native applied_position to each row on an unscoped route.
  // Positions are comparable within the issuing database incarnation and branch.
  bool observe_applied_positions = 10;
}
message ChangesTrailer {
  // For ascending pages this is the next exclusive lower bound.
  // For descending pages this is the next inclusive upper bound.
  Basis through = 1;
  // The requested interval is covered, up to the captured head when until is absent.
  bool complete = 2;
}
message ChangesFrame {
  oneof frame {
    bytes arrow_ipc = 1;
    ChangesTrailer trailer = 2;
  }
}
enum AnomalyCategory {
  ANOMALY_CATEGORY_UNSPECIFIED = 0;
  ANOMALY_CATEGORY_INCORRECT = 1;
  ANOMALY_CATEGORY_UNSUPPORTED = 2;
  ANOMALY_CATEGORY_NOT_FOUND = 3;
  ANOMALY_CATEGORY_FORBIDDEN = 4;
  ANOMALY_CATEGORY_CONFLICT = 5;
  ANOMALY_CATEGORY_BUSY = 6;
  ANOMALY_CATEGORY_UNAVAILABLE = 7;
  ANOMALY_CATEGORY_INTERRUPTED = 8;
  ANOMALY_CATEGORY_FAULT = 9;
}
// Serialized in the rtdb-error-bin status metadata.
message Error {
  AnomalyCategory category = 1;
  // A failed Transact requirement uses conflict / rtdb/requirement-failed.
  string code = 2;
  string message = 3;
  optional string feature = 4;
  optional uint64 retry_after_millis = 5;
}
