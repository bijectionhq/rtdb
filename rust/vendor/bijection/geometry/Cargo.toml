[package]
name = "bijection-rank-geometry"
version = "0.1.0"
edition = "2024"
license-file = "../LICENSE.md"
publish = false

# Bijection's crates/geometry at the vendored commit, verbatim src/: the
# geometry store_read ranks with. RTDB's own SQL spatial functions keep
# ../../bijection-geometry.
[lib]
name = "geometry"
doctest = false

[dependencies]
num-rational = "=0.4.2"
num-traits = "=0.2.19"
libm = "=0.2.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
anyhow = "1"
