SPECIFICATION FairSpec
CONSTANTS
    Keepers = {k1, k2, k3}
    Payloads = {a, b}
    MaxEpoch = 2
    MaxWrites = 2
    MaxLost = 1
    AllowEarlyTrim = FALSE
    AllowPartialSync = FALSE
INVARIANT
    OneHistory
    TrimFollowsPublication
    CheckpointIsCommitted
    RecoveredHistoryContainsCommits
    SyncedHistoryIsComplete
    CommitsSurvive
    EachQuorumCoversUncheckpointedCommits
    AcknowledgedWritesSurvive
    AcknowledgmentsAreCommitted
    ReadyImpliesCommittedView
PROPERTY EventuallyReady
CHECK_DEADLOCK FALSE
